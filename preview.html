<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Qué monstruo sos? — Monzénora</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4d9c8;color:#2d2340;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px}.app{width:min(760px,100%);background:#fffaf5;border-radius:28px;padding:34px;box-shadow:0 12px 40px rgba(45,35,64,.16)}.top{text-align:center}h1{margin:0 0 8px;font-size:clamp(30px,6vw,52px)}.subtitle{margin:0 auto 28px;max-width:560px;line-height:1.5}.progress{height:10px;background:#eadbd3;border-radius:99px;overflow:hidden;margin-bottom:28px}.progress-bar{height:100%;width:0;background:#2d2340;transition:width .25s}.question-number{font-size:14px;opacity:.65;margin-bottom:8px}h2{font-size:clamp(23px,4vw,32px);margin:0 0 22px;line-height:1.2}.answers{display:grid;gap:13px}button.answer,.main-btn{border:2px solid #2d2340;background:#fffaf5;color:#2d2340;border-radius:17px;padding:17px 18px;font-size:17px;text-align:left;cursor:pointer;transition:.15s}button.answer:hover{transform:translateY(-2px);background:#f0e3dc}button.answer.selected{background:#2d2340;color:white}.navigation{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.main-btn{text-align:center;background:#2d2340;color:white;min-width:130px;font-weight:700}.main-btn.secondary{background:transparent;color:#2d2340}.main-btn:disabled{opacity:.35;cursor:not-allowed}.hidden{display:none!important}.result{text-align:center;padding:12px 0 4px}.result-badge{display:inline-block;padding:10px 18px;border-radius:999px;border:2px solid #2d2340;font-weight:700;margin-bottom:18px}.result h2{font-size:clamp(38px,9vw,70px);margin-bottom:12px}.result p{font-size:19px;line-height:1.55;max-width:580px;margin:0 auto 25px}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px auto;max-width:600px}.score{border:1px solid #d9c8bf;border-radius:14px;padding:12px 6px}.score strong{display:block;font-size:22px;margin-top:4px}.note{font-size:13px;opacity:.6;margin-top:18px}@media(max-width:600px){.app{padding:24px 18px}.scores{grid-template-columns:repeat(2,1fr)}.navigation{flex-direction:column-reverse}.main-btn{width:100%}}</style></head><body><div class="app"><section id="intro"><div class="top"><h1>¿Qué monstruo sos?</h1><p class="subtitle">Descubrí con qué grupo de Monzénora te identificás más. Elegí la respuesta que más se parezca a vos. No hay respuestas correctas o incorrectas.</p><button class="main-btn" onclick="startQuiz()">Empezar</button></div></section><section id="quiz" class="hidden"><div class="progress"><div id="progressBar" class="progress-bar"></div></div><div class="question-number" id="questionNumber"></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="navigation"><button class="main-btn secondary" id="backBtn" onclick="previousQuestion()">Atrás</button><button class="main-btn" id="nextBtn" onclick="nextQuestion()" disabled>Siguiente</button></div></section><section id="result" class="hidden result"><div class="result-badge">RESULTADO</div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="scores" id="scores"></div><button class="main-btn" onclick="restartQuiz()">Volver a empezar</button><p class="note">Este resultado es una experiencia lúdica dentro de Monzénora, no un test psicológico.</p></section></div><script>const questions=[{q:"Llegás a un lugar donde no conocés a nadie. ¿Qué hacés?",a:["Empiezo a hablar con alguien y trato de integrarme.","Primero observo lo que está pasando y después decido con quién acercarme.","Me tomo mi tiempo y busco un lugar donde sentirme cómodo/a.","Voy por mi cuenta y dejo que las cosas sucedan naturalmente."]},{q:"Si tenés que resolver un problema inesperado...",a:["Busco ayuda y lo resuelvo junto con otras personas.","Analizo todas las posibilidades antes de actuar.","Me alejo un poco para pensar y encontrar una solución tranquila.","Improviso y pruebo diferentes maneras hasta encontrar una que funcione."]},{q:"¿Qué plan preferís para un día libre?",a:["Juntarme con muchas personas y hacer algo divertido.","Recorrer un lugar nuevo y descubrir cosas que no conocía.","Quedarme tranquilo/a, escuchar música, mirar algo o hacer algo creativo.","Hacer algo diferente, salir de la rutina o vivir una experiencia nueva."]},{q:"Cuando formás parte de un grupo...",a:["Me gusta participar y mantener al grupo unido.","Suelo prestar atención a lo que hace cada persona.","Me gusta que cada integrante tenga su espacio.","No necesito seguir siempre lo que hace el resto."]},{q:"¿Qué hacés cuando alguien piensa diferente a vos?",a:["Intento encontrar algo que podamos compartir.","Quiero entender por qué piensa de esa manera.","Escucho y respeto su forma de pensar.","No me preocupa que pensemos diferente."]},{q:"¿Cuál de estas situaciones te representa más?",a:["Estar rodeado/a de gente y compartir un momento juntos.","Descubrir algo que los demás todavía no vieron.","Tener un momento propio para imaginar o crear.","Hacer algo que nadie esperaba que hicieras."]},{q:"Cuando tenés que tomar una decisión...",a:["Pregunto qué piensan las personas que me rodean.","Pienso mucho antes de decidir.","Me dejo llevar por lo que siento en ese momento.","Confío en mi propia decisión."]},{q:"¿Qué característica valorás más en otras personas?",a:["Que sean divertidas y compañeras.","Que sean curiosas y observadoras.","Que sean comprensivas y tranquilas.","Que sean independientes y auténticas."]},{q:"Si tenés que participar en una actividad que nunca hiciste...",a:["Me entusiasma hacerla con otras personas.","Primero quiero entender cómo funciona.","Observo un poco y después me sumo cuando me siento preparado/a.","Me mando y veo qué pasa."]},{q:"¿Qué preferís?",a:["Pertenecer a un grupo y compartir experiencias.","Sentir que puedo aportar algo diferente al grupo.","Sentirme cómodo/a siendo yo mismo/a.","Tener libertad para hacer las cosas a mi manera."]}];const groups=["BEIBOSOS","MIRONTES","NUBULOS","ALTOFIS"];const descriptions={BEIBOSOS:"Te identificás con los BEIBOSOS: sociable, compañera/o y con ganas de compartir con los demás.",MIRONTES:"Te identificás con los MIRONTES: observador/a, curioso/a y atento/a a lo que sucede a tu alrededor.",NUBULOS:"Te identificás con los NUBULOS: tranquilo/a, creativo/a y con una forma propia de habitar los espacios.",ALTOFIS:"Te identificás con los ALTOFIS: independiente, auténtico/a y con libertad para hacer las cosas a tu manera."};let current=0,answers=Array(questions.length).fill(null);function startQuiz(){document.getElementById("intro").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");renderQuestion()}function renderQuestion(){const item=questions[current];document.getElementById("questionNumber").textContent=`Pregunta ${current+1} de ${questions.length}`;document.getElementById("question").textContent=item.q;document.getElementById("progressBar").style.width=`${((current+1)/questions.length)*100}%`;const c=document.getElementById("answers");c.innerHTML="";item.a.forEach((answer,index)=>{const b=document.createElement("button");b.className="answer"+(answers[current]===index?" selected":"");b.textContent=answer;b.onclick=()=>selectAnswer(index);c.appendChild(b)});document.getElementById("backBtn").disabled=current===0;document.getElementById("nextBtn").disabled=answers[current]===null;document.getElementById("nextBtn").textContent=current===questions.length-1?"Ver resultado":"Siguiente"}function selectAnswer(index){answers[current]=index;renderQuestion()}function previousQuestion(){if(current>0){current--;renderQuestion()}}function nextQuestion(){if(answers[current]===null)return;if(current<questions.length-1){current++;renderQuestion()}else showResult()}function showResult(){const scores=[0,0,0,0];answers.forEach(a=>scores[a]++);const max=Math.max(...scores);const winners=scores.map((s,i)=>s===max?i:-1).filter(i=>i!==-1);let winner=winners[0];if(winners.length>1){for(let i=answers.length-1;i>=0;i--){if(winners.includes(answers[i])){winner=answers[i];break}}}document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");document.getElementById("resultTitle").textContent=`SOS ${groups[winner]}`;document.getElementById("resultText").textContent=descriptions[groups[winner]];const sc=document.getElementById("scores");sc.innerHTML="";groups.forEach((g,i)=>{const d=document.createElement("div");d.className="score";d.innerHTML=`${g}<strong>${scores[i]}</strong>`;sc.appendChild(d)})}function restartQuiz(){current=0;answers=Array(questions.length).fill(null);document.getElementById("result").classList.add("hidden");document.getElementById("intro").classList.remove("hidden")}</script></body></html>
